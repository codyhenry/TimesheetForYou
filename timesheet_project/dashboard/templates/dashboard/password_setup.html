<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password | TimesheetForYou</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }
    .card {
      width: min(100%, 440px);
      margin: 24px;
      padding: 32px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0 0 24px;
      color: #52606d;
      line-height: 1.45;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 14px;
    }
    .errors {
      margin: 0 0 16px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #fff4f4;
      color: #b42318;
    }
    .errors ul {
      margin: 0;
      padding-left: 18px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #2c3e50;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Set your password</h1>
    <p>Your account is using a temporary password. Create a new password before continuing to the dashboard.</p>

    {% if form.errors %}
      <div class="errors">
        {{ form.errors }}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_old_password">Current password</label>
      {{ form.old_password }}

      <label for="id_new_password1">New password</label>
      {{ form.new_password1 }}

      <label for="id_new_password2">Confirm new password</label>
      {{ form.new_password2 }}

      <button type="submit">Update password</button>
    </form>
  </main>
</body>
</html>
