<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | TimesheetForYou</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --card: #ffffff;
            --ink: #111827;
            --muted: #6b7280;
            --border: #d1d5db;
            --accent: #1f2937;
            --accent-soft: #eef2ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, #fef3c7 0, transparent 30%),
                radial-gradient(circle at bottom right, #dbeafe 0, transparent 34%),
                var(--bg);
            color: var(--ink);
            font-family: Arial, sans-serif;
        }
        .card {
            width: min(680px, 100%);
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: #3730a3;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 18px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1.05;
        }
        p {
            margin: 0 auto 26px;
            max-width: 520px;
            color: var(--muted);
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        .illustration {
            margin: 0 auto 22px;
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: #fffbeb;
            font-size: 2.4rem;
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="page-title">
        <div class="illustration" aria-hidden="true">🧸</div>
        <div class="badge">404 · Lost timesheet</div>
        <h1 id="page-title">This page wandered off during nap time.</h1>
        <p>
            The page you requested does not exist, may have moved, or is no longer available.
            Head back to the dashboard to find submitted timesheets and admin tools.
        </p>
        <a class="button" href="{% url 'dashboard-index' %}">Go to Dashboard</a>
    </main>
</body>
</html>
