<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your Timesheet password</title>
    <style>
        body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f8f9fa; color: #212529; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 480px; background: #fff; border: 1px solid #dee2e6; border-radius: 12px; padding: 28px; box-shadow: 0 12px 32px rgba(0,0,0,.08); }
        h1 { margin: 0 0 8px; color: #2c3e50; }
        p { color: #6c757d; line-height: 1.5; }
        label { display: block; font-weight: 700; margin: 16px 0 6px; }
        input { box-sizing: border-box; width: 100%; border: 1px solid #ced4da; border-radius: 8px; padding: 12px; font-size: 16px; }
        button { margin-top: 20px; width: 100%; border: 0; border-radius: 8px; background: #2c3e50; color: #fff; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .errorlist { color: #b00020; margin: 6px 0 0; padding-left: 20px; }
        .message { background: #e7f5ff; border: 1px solid #a5d8ff; color: #0b7285; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Reset your password</h1>
        <p>Enter your account email. If an account exists for that email, we will send password reset instructions.</p>
        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="{{ form.email.id_for_label }}">Email</label>
            {{ form.email }}
            {{ form.email.errors }}
            <button type="submit">Send reset instructions</button>
        </form>
    </main>
</body>
</html>
