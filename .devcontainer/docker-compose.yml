version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached

    command: sleep infinity

    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-devcontainer-local-key"
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: "timesheet_for_you"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"

      # NPM retry behavior helps in Codespaces/devcontainers with flaky networking.
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "timesheet_for_you"
      POSTGRES_PASSWORD: "postgres"

volumes:
  postgres-data: